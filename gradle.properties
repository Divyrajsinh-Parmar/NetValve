# Tuned for a normal laptop (MacBook Air M1). The original NetValve file was tuned for a
# 4 GB CI sandbox: -Xmx2600m, no daemon, no parallel. If a build ever runs out of memory,
# restore it with:  git checkout pinned-base -- gradle.properties   (or lower -Xmx).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Compile Kotlin + run KSP inside the Gradle JVM (no separate Kotlin daemon).
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
ksp.incremental=false
